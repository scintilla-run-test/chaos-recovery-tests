name: oreslang compiler options validation
on:
  push:
    branches: ["test/oreslang-compiler-options-f412b0c-v2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          cache-dependency-path: oreslang-source/pom.xml
      - name: Focused compiler-options tests
        working-directory: oreslang-source
        run: mvn -B -ntp -Dtest=CompilerOptionsTest test
      - name: Full Maven verification
        working-directory: oreslang-source
        run: mvn -B -ntp verify

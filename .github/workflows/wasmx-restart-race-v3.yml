name: wasm-xprs restart and deploy race proof v3

on:
  push:
    branches:
      - probe/wasmx-restart-race-v3-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged daemon main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-daemon
          ref: 9906d0bdfc4fe1760fca75569670f91e793e1c85
          path: daemon
          persist-credentials: false

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - name: Build daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path daemon/Cargo.toml

      - name: Race immutable deploys, restart, and detect tampering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture
          python3 - <<'PY'
          import base64, json, pathlib
          root = pathlib.Path('fixture')
          a = bytes.fromhex(
              '0061736d01000000'
              '0105016000017f'
              '03020100'
              '0503010001'
              '071702066d656d6f727902000a7761736d785f6d61696e0000'
              '0a0601040041000b'
          )
          b = bytes.fromhex(
              '0061736d01000000'
              '0105016000017f'
              '03020100'
              '0503010001'
              '071702066d656d6f727902000a7761736d785f6d61696e0000'
              '0a0601040041010b'
          )
          fixtures = {
              'same.json': ('same-bytes', a),
              'mixed-a.json': ('mixed-bytes', a),
              'mixed-b.json': ('mixed-bytes', b),
          }
          for name, (deployment, module) in fixtures.items():
              (root/name).write_text(json.dumps({
                  'tenant_id': 'chaos-tenant',
                  'deployment_id': deployment,
                  'wasm_base64': base64.b64encode(module).decode(),
              }))
          PY

          export PROOF_HOME="$RUNNER_TEMP/wasmx-chaos-home"
          export PROOF_ARTIFACTS="$RUNNER_TEMP/wasmx-chaos-artifacts"
          mkdir -p "$PROOF_HOME"

          start_daemon() {
            HOME="$PROOF_HOME" WASMX_ARTIFACT_ROOT="$PROOF_ARTIFACTS" \
              ./daemon/target/debug/wasmx-desktop-daemon >"$RUNNER_TEMP/wasmx-chaos.log" 2>&1 &
            DAEMON_PID=$!
            for attempt in $(seq 1 80); do
              if curl -fsS http://127.0.0.1:8766/healthz >/dev/null; then
                return 0
              fi
              sleep 0.25
            done
            cat "$RUNNER_TEMP/wasmx-chaos.log" >&2
            return 1
          }

          stop_daemon() {
            kill "$DAEMON_PID" 2>/dev/null || true
            wait "$DAEMON_PID" 2>/dev/null || true
          }

          start_daemon
          trap stop_daemon EXIT
          export TOKEN
          TOKEN=$(cat "$PROOF_HOME/.wasm-xprs/daemon/token")

          # Identical concurrent publishes must be idempotent.
          seq 1 32 | xargs -P16 -I{} sh -c '
            code=$(curl -sS -o "$RUNNER_TEMP/same-{}.out" -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @fixture/same.json http://127.0.0.1:8766/v1/deploy)
            test "$code" = 200
          '

          # Different bytes racing for one immutable generation: exactly one byte identity wins.
          request_pids=()
          for i in $(seq 1 24); do
            if test $((i % 2)) = 0; then
              body=fixture/mixed-a.json
            else
              body=fixture/mixed-b.json
            fi
            (
              code=$(curl -sS -o "$RUNNER_TEMP/mixed-$i.out" -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                --data-binary @"$body" http://127.0.0.1:8766/v1/deploy)
              printf '%s\n' "$code" >"$RUNNER_TEMP/mixed-$i.code"
            ) &
            request_pids+=("$!")
          done
          for pid in "${request_pids[@]}"; do
            wait "$pid"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          codes = [p.read_text().strip() for p in sorted(root.glob('mixed-*.code'))]
          assert len(codes) == 24, codes
          assert all(c in {'200', '409'} for c in codes), codes
          assert '200' in codes, codes
          assert '409' in codes, codes
          PY

          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8766/v1/deployments/chaos-tenant/same-bytes >"$RUNNER_TEMP/same-before.json"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8766/v1/deployments/chaos-tenant/mixed-bytes >"$RUNNER_TEMP/mixed-before.json"
          python3 - "$RUNNER_TEMP/same-before.json" "$RUNNER_TEMP/mixed-before.json" <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              value = json.load(open(path))
              assert value['integrity_verified'] is True, value
              assert len(value['sha256']) == 64, value
          PY

          # Restart with empty process-local cache; persisted identity must survive exactly.
          stop_daemon
          trap - EXIT
          start_daemon
          trap stop_daemon EXIT
          TOKEN=$(cat "$PROOF_HOME/.wasm-xprs/daemon/token")
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8766/v1/deployments/chaos-tenant/same-bytes >"$RUNNER_TEMP/same-after.json"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8766/v1/deployments/chaos-tenant/mixed-bytes >"$RUNNER_TEMP/mixed-after.json"
          python3 - "$RUNNER_TEMP/same-before.json" "$RUNNER_TEMP/same-after.json" \
                   "$RUNNER_TEMP/mixed-before.json" "$RUNNER_TEMP/mixed-after.json" <<'PY'
          import json, sys
          before_same, after_same, before_mixed, after_mixed = [json.load(open(p)) for p in sys.argv[1:]]
          assert after_same['integrity_verified'] is True, after_same
          assert after_mixed['integrity_verified'] is True, after_mixed
          assert before_same['sha256'] == after_same['sha256']
          assert before_mixed['sha256'] == after_mixed['sha256']
          PY

          # Direct disk mutation must never be silently re-admitted after restart.
          stop_daemon
          trap - EXIT
          printf 'tampered' >"$PROOF_ARTIFACTS/chaos-tenant/same-bytes/module.wasm"
          start_daemon
          trap stop_daemon EXIT
          TOKEN=$(cat "$PROOF_HOME/.wasm-xprs/daemon/token")
          code=$(curl -sS -o "$RUNNER_TEMP/tamper.out" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8766/v1/deployments/chaos-tenant/same-bytes)
          test "$code" = 500
          grep -Eqi 'integrity|sha256|module' "$RUNNER_TEMP/tamper.out"
